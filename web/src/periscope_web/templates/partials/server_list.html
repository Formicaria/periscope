<div id="servers" class="space-y-6">
  {% for server in servers %}
  {% include "partials/server_form.html" %}
  {% endfor %}

  <form id="server-add" class="card bg-base-200 shadow-sm" method="post" action="/discord/servers"
        hx-post="/discord/servers" hx-target="#servers" hx-swap="outerHTML">
    <div class="card-body p-4 gap-3">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <h3 class="text-xs uppercase tracking-widest opacity-60">Add a Discord server</h3>
      <p class="text-xs opacity-70">Each service picks the server it posts in; one bot can serve several servers at once.</p>
      <div class="grid gap-x-6 gap-y-3 md:grid-cols-2">
        {% if known %}
        <div class="form-control md:col-span-2">
          <label class="label py-1"><span class="label-text text-sm">A server the bot is already in</span></label>
          <select name="pick" class="select select-bordered select-sm">
            <option value="">— type a name and id below instead —</option>
            {% for g in known %}<option value="{{ g.id }}">{{ g.name }} · {{ g.id }}</option>{% endfor %}
          </select>
        </div>
        {% endif %}
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-sm">Name</span></label>
          <input name="name" class="input input-bordered input-sm" placeholder="shown in embed footers">
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-sm">Discord server id</span></label>
          <input name="guild_id" class="input input-bordered input-sm mono" placeholder="right-click the server → Copy Server ID">
        </div>
      </div>
      <div class="card-actions items-center gap-3 mt-2">
        <button class="btn btn-primary btn-sm">Add server</button>
        <span class="text-xs opacity-60">the bot must be invited to it before it can post there</span>
      </div>
    </div>
  </form>
</div>
