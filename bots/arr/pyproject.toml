[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "periscope_arr"
version = "0.1.2"
description = "periscope bot for Sonarr/Radarr/Lidarr/Prowlarr, qBittorrent/SABnzbd and Plex/Jellyfin."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "periscope>=0.1",
    "discord.py>=2.4,<3",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
