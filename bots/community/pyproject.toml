[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "periscope_community"
version = "0.3.0"
description = "periscope service for a community Discord: public status board, outage notices that say why, and admin-scheduled maintenance announcements."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "periscope>=0.1",
    "discord.py>=2.4,<3",
    "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
