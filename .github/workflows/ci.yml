name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bot: [core, proxmox, prometheus, arr, unifi, github, plexrequests, docker, web]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # what the box runs (Debian trixie)
      - run: pip install -e core pytest pytest-asyncio
      - if: matrix.bot != 'core'
        run: pip install -e ${{ matrix.bot == 'web' && 'web' || format('bots/{0}', matrix.bot) }}
      - run: python -m compileall -q core/src ${{ matrix.bot == 'web' && 'web/src' || matrix.bot != 'core' && format('bots/{0}/src', matrix.bot) || '' }}
      - run: pytest -q ${{ matrix.bot == 'core' && 'core' || matrix.bot == 'web' && 'web' || format('bots/{0}', matrix.bot) }}
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n setup.sh update.sh periscope.cli deploy/lxc-create.sh
