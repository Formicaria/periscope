# periscope — Docker (secondary deploy path). One container runs every enabled service + the web UI.
#   docker compose up -d
#   open http://<host>:8090 — first sign-in uses the setup token from `docker compose logs periscope`
services:
  periscope:
    image: ghcr.io/formicaria/periscope:latest
    # build: .
    container_name: periscope
    restart: unless-stopped
    ports:
      - "8090:8090"      # web UI
      - "8080:8080"      # inbound webhooks (Sonarr/Radarr/Alertmanager/GitHub) — put behind your reverse proxy
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
